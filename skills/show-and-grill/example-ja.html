# Q1. 説明のページを開くリンクを、http と file のどちらにしますか？

> 見本（概要）。この skill の最初の版で実際に決めた問いを、この skill の型で書いたもの。

<div class="summary">

- 説明のページは、問いごとに 1 枚の HTML ファイルとして書き出す。
- http のリンクは自分の PC の中の小さなサーバーを通る。file のリンクはファイルを直接開く。
- file のリンクは、ブラウザや WSL の設定によって開けないことがある。

</div>

**決めること**: 問いごとのメッセージに付けるリンクの形。
なぜ今か: すべての問いのメッセージに付くので、後で変えると skill の手順を全部直すことになる。

## 今どうなっているか: ページはファイルで、試した環境では両方のリンクが開いた

- 説明のページは、問いごとに 1 枚の HTML ファイルとして書き出す。
- Windows Terminal と WSL（Windows で Linux を動かす仕組み）では、http と file のどちらのリンクもクリックで開いた。
- ただし file のリンクは、WSL やブラウザのセキュリティの設定によって開けないことがある。

## 案ごとの違い: http はサーバーを 1 つ通り、file は通らない

この図で見てほしいこと: **http では、ブラウザがファイルを直接読まず、小さなサーバーが読む。**

- ① ブラウザが、自分の PC の中の小さなサーバーに要求する。サーバーが動いている必要がある。
- ② サーバーは、問いのフォルダの中のページだけを読む。
- ③ ブラウザがファイルを自分で開く。設定によっては、ここで止められる。

| | A: http | B: file |
|---|---|---|
| クリックで開くか | 設定に関係なく開く | 設定によっては開かない |
| 始めるときの準備 | サーバーを 1 つ起動する（120 分使わなければ止まる） | なし |
| Python がない環境 | 使えない | 使える |

## 推奨と理由: A（http）を標準にし、サーバーを起動できないときだけ B

**推奨: A を標準にし、サーバーを起動できないときだけ B にする。**

- 説明のページはクリックで開ける必要がある。B は開かない設定があると分かっているので、標準にできない。

この推奨が誤りになる条件: Python のない PC（WSL を使わない Windows など）が主な利用環境なら、B を標準にするほうがよい。
