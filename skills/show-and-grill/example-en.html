# Q1. Should the link to each page use http or file?

> Example (summary depth). A real question from the first version of this skill, written in this skill's format.

<div class="summary">

- Each question gets one HTML page on disk.
- An http link goes through a small server on your own computer. A file link opens the file directly.
- Some browser and WSL settings block file links.

</div>

**What to decide**: the form of the link under each question.
Why now: every question message carries this link, so a later change touches every step of the skill.

## Now: pages are files, and both links opened in one test

- The skill writes one HTML file for each question.
- In Windows Terminal with WSL (the Windows Subsystem for Linux), both an http link and a file link opened on click.
- A file link can still fail under some WSL or browser security settings.

## Options: http adds a server step, file skips it

What to see in this figure: **with http, the browser does not read the file itself. A small server reads it.**

- ① The browser asks a small server on your own computer. The server must be running.
- ② The server reads only the pages in the question folder.
- ③ The browser opens the file itself. Some settings block this step.

| | A: http | B: file |
|---|---|---|
| Opens on click | Yes, with any setting | Not with some settings |
| Setup | Start one server (it stops after 120 idle minutes) | None |
| Without Python | Does not work | Works |

## Recommendation: A (http), with B only when the server cannot start

**Recommendation: A by default. Use B only when the server cannot start.**

- A page must open on click. B fails in some known settings, so it cannot be the default.

This is wrong if: most people use a computer without Python (for example, Windows without WSL). Then B is the better default.

<details>
<summary>Evidence (what we checked)</summary>

- **Both links opened**: tested on 2026-11-07 with Claude Code in Windows Terminal and WSL.
- **A file link can fail**: reported by the maintainer during the first version.
- **Only your own computer can reach the server**: it listens on 127.0.0.1. (`scripts/serve.py:43`, `scripts/serve.py:265`)
- **The server stops after 120 idle minutes**: (`scripts/serve.py:360`)

</details>
